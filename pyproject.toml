[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-continual-learning"
version = "0.2.0"
description = "Diagonal-rate null-space update for continual learning (numpy implementation of the formalised update)"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["stable_cl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
